<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Caza Pokémon</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    border:1px solid #ccc;
    padding:10px;
    margin-bottom:20px;
    width:300px;
}

img{
    width:300px;
}

#contador{
    font-size:24px;
    font-weight:bold;
    margin-bottom:30px;
}
</style>

</head>
<body>

<h1>🔍 Caza Pokémon 🔍</h1>

<div id="contador">
0 / 2 Pokémon encontrados
</div>

<div class="card">
    <img src="pokemon1.jpg">
    <br><br>
    <input type="checkbox" class="pokemon">
    Encontrado
</div>

<div class="card">
    <img src="pokemon2.jpg">
    <br><br>
    <input type="checkbox" class="pokemon">
    Encontrado
</div>

<script>

const checks = document.querySelectorAll(".pokemon");

function actualizarContador(){

    let encontrados = 0;

    checks.forEach(check => {

        if(check.checked){
            encontrados++;
        }

    });

    document.getElementById("contador").innerText =
        encontrados + " / " + checks.length + " Pokémon encontrados";
}

checks.forEach(check => {

    check.addEventListener("change", actualizarContador);

});

</script>

</body>
</html>
